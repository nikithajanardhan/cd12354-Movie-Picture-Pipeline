name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/backend/**"
      - ".github/workflows/backend-cd.yaml"
  workflow_dispatch:

env:
  aws_region: ${{ secrets.AWS_REGION }}
  ecr_repository: backend
  eks_cluster: cluster

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pipenv
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install Pipenv
        run: python -m pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev --deploy

      - name: Run lint
        run: pipenv run lint

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pipenv
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install Pipenv
        run: python -m pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev --deploy

      - name: Run tests
        run: pipenv run test

  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        env:
          ecr_registry: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$ecr_registry/$ecr_repository:${{ github.sha }}" ./starter/backend
          docker tag "$ecr_registry/$ecr_repository:${{ github.sha }}" "$ecr_registry/$ecr_repository:latest"

      - name: Push backend Docker image
        env:
          ecr_registry: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push "$ecr_registry/$ecr_repository:${{ github.sha }}"
          docker push "$ecr_registry/$ecr_repository:latest"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$aws_region" --name "$eks_cluster"

      - name: Set backend image
        working-directory: starter/backend/k8s
        env:
          ecr_registry: ${{ steps.login-ecr.outputs.registry }}
        run: kustomize edit set image backend="$ecr_registry/$ecr_repository:${{ github.sha }}"

      - name: Deploy backend to EKS
        working-directory: starter/backend/k8s
        run: kustomize build . | kubectl apply -f -

      - name: Wait for backend rollout
        run: kubectl rollout status deployment/backend --timeout=180s

      - name: Show backend resources
        run: kubectl get deployment,service,pods -l app=backend -o wide
