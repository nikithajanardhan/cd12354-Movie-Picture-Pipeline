name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/frontend/**"
      - ".github/workflows/frontend-cd.yaml"
  workflow_dispatch:

env:
  aws_region: us-east-1
  ecr_repository: frontend
  eks_cluster: cluster

jobs:
  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and restore npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "18.14.0"
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and restore npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "18.14.0"
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        env:
          CI: true
        run: npm test -- --watchAll=false

  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend Docker image
        env:
          ecr_registry: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${{ secrets.REACT_APP_MOVIE_API_URL }}" \
            -t "$ecr_registry/$ecr_repository:${{ github.sha }}" \
            ./starter/frontend
          docker tag "$ecr_registry/$ecr_repository:${{ github.sha }}" "$ecr_registry/$ecr_repository:latest"

      - name: Push frontend Docker image
        env:
          ecr_registry: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push "$ecr_registry/$ecr_repository:${{ github.sha }}"
          docker push "$ecr_registry/$ecr_repository:latest"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$aws_region" --name "$eks_cluster"

      - name: Set frontend image
        working-directory: starter/frontend/k8s
        env:
          ecr_registry: ${{ steps.login-ecr.outputs.registry }}
        run: kustomize edit set image frontend="$ecr_registry/$ecr_repository:${{ github.sha }}"

      - name: Deploy frontend to EKS
        working-directory: starter/frontend/k8s
        run: kustomize build . | kubectl apply -f -

      - name: Wait for frontend rollout
        run: kubectl rollout status deployment/frontend --timeout=180s

      - name: Show frontend resources
        run: kubectl get deployment,service,pods -l app=frontend -o wide
